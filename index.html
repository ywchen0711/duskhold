<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Duskhold 暗月迷城</title>
<meta name="description" content="An action RPG: three classes, randomly built dungeons, three great bosses, and loot with magic, rare and unique items.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%231a1418'/%3E%3Cpath d='M10.5 3a5 5 0 1 0 2.5 8.5A4 4 0 0 1 10.5 3z' fill='%23e8c070'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+TC:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="flash"></div>

<div id="hud" hidden>
  <div id="area"></div>
  <canvas id="mini" width="150" height="150"></canvas>
  <div id="foe" hidden><b id="foeName"></b><small id="foeMods"></small><div class="bar"><i id="foeFill"></i></div></div>
  <div id="bottom">
    <div class="orb life"><i id="lifeFill"></i><span id="lifeTxt"></span></div>
    <div class="mid">
      <div class="xpbar"><i id="xpFill"></i></div>
      <div class="row">
        <div class="belt"><button id="pot1"></button><button id="pot2"></button><button id="pot3"></button><button id="tpBtn"></button></div>
        <div id="skillbar"></div>
        <div class="menu"><button id="bInv" title="I">🎒</button><button id="bSkills" title="K">📜</button><button id="bMap" title="Tab">🗺️</button><button id="bHelp">⚙️</button><button id="alertPts" hidden>❗</button></div>
      </div>
      <div id="lvl"></div>
    </div>
    <div class="orb mana"><i id="manaFill"></i><span id="manaTxt"></span></div>
  </div>
  <div id="msg"></div>
  <div id="banner"></div>
  <div id="toasts"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="touchBtns"><button id="tH">🧪</button><button id="tM">🧴</button><button id="tTP">📜</button><button id="tQ"></button><button id="tE"></button><button id="tR"></button><button id="tF"></button><button id="tatk">⚔️</button></div>
</div>

<div id="win" class="screen" hidden><div class="panel"><div class="head"><h2 id="winTitle"></h2><button id="winX" class="x">✕</button></div><div id="winBody"></div></div></div>
<div id="tip" hidden></div>

<div id="select" class="screen">
  <div class="panel selp">
    <button id="sLang" class="ghost langb"></button>
    <h1 id="sTitle"></h1>
    <p id="sSub" class="sub"></p>
    <div id="sChars"></div>
    <h3 id="sNewH"></h3>
    <p id="sPick" class="dim"></p>
    <div id="sClasses"></div>
    <div class="newrow"><label><span id="sNameL"></span><input id="sName" maxlength="14" autocomplete="off" spellcheck="false"></label><button id="sCreate" class="big"></button></div>
    <p id="sKeys" class="dim small"></p>
  </div>
</div>

<script type="module" src="js/main.js?v=1"></script>
<script src="/hub.js" data-pos="top-left" defer></script>
</body>
</html>
